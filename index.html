    <!-- Dynamic Absolute Metadata Resolving for WhatsApp, Facebook, Telegram & Mobile Previewers -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && origin.indexOf('http') === 0) {
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg && ogImg.getAttribute('content').charAt(0) === '/') {
              ogImg.setAttribute('content', origin + ogImg.getAttribute('content'));
            }
            var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
            if (ogSecImg && ogSecImg.getAttribute('content').charAt(0) === '/') {
              ogSecImg.setAttribute('content', origin + ogSecImg.getAttribute('content'));
            }
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg && twImg.getAttribute('content').charAt(0) === '/') {
              twImg.setAttribute('content', origin + twImg.getAttribute('content'));
            }
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl && ogUrl.getAttribute('content').charAt(0) === '/') {
              ogUrl.setAttribute('content', window.location.href);
            }
            var itemImg = document.querySelector('meta[itemprop="image"]');
            if (itemImg && itemImg.getAttribute('content').charAt(0) === '/') {
              itemImg.setAttribute('content', origin + itemImg.getAttribute('content'));
            }
            var linkImg = document.querySelector('link[rel="image_src"]');
            if (linkImg && linkImg.getAttribute('href').charAt(0) === '/') {
              linkImg.setAttribute('href', origin + linkImg.getAttribute('href'));
            }
          }
        } catch (e) {}
      })();
    </script>
