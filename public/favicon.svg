<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8222" />
      <stop offset="100%" stop-color="#f5e4ab" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="50%" stop-color="#0e0d0b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded octagon / luxury badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="9" y="9" width="82" height="82" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3,2" />
  <circle cx="50%" cy="50%" r="40" fill="url(#sheen)" />

  <!-- Four corner micro heraldic stars -->
  <circle cx="15" cy="15" r="1.5" fill="#d4af37" />
  <circle cx="85" cy="15" r="1.5" fill="#d4af37" />
  <circle cx="15" cy="85" r="1.5" fill="#d4af37" />
  <circle cx="85" cy="85" r="1.5" fill="#d4af37" />

  <!-- Crown / Coronet Top Motif -->
  <path d="M 38 27 L 44 32 L 50 24 L 56 32 L 62 27 L 60 36 L 40 36 Z" fill="url(#goldGrad)" />
  <circle cx="38" cy="25" r="1.2" fill="#fff3be" />
  <circle cx="50" cy="22" r="1.5" fill="#fff3be" />
  <circle cx="62" cy="25" r="1.2" fill="#fff3be" />

  <!-- Monogram F & I interlaced in regal serif -->
  <g filter="url(#goldGlow)">
    <!-- Letter F -->
    <path d="M 34 40 L 52 40 L 52 44 L 40 44 L 40 52 L 49 52 L 49 56 L 40 56 L 40 73 L 34 73 Z" fill="url(#goldGrad)" />
    
    <!-- Letter I (Intertwined Royal Column) -->
    <path d="M 57 40 L 67 40 L 67 44 L 63.5 44 L 63.5 69 L 67 69 L 67 73 L 57 73 L 57 69 L 60.5 69 L 60.5 44 L 57 44 Z" fill="url(#goldGrad)" />
    
    <!-- Central decorative diamond -->
    <polygon points="50,52 53,55 50,58 47,55" fill="#fff3be" />
  </g>

  <!-- Established 2016 ribbon text arc / lower gold bar -->
  <rect x="30" y="78" width="40" height="2" rx="1" fill="url(#goldGrad)" />
  <circle cx="50" cy="79" r="2" fill="#fff3be" />
</svg>
